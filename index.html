<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="YoursFriend Labs — Courses, PasalManager, and our full ecosystem of products, all in one place."
    />
    <meta
      name="theme-color"
      content="#F9FAFB"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f1117"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="YoursFriend Labs | Link Hub" />
    <meta
      property="og:description"
      content="Building innovative software products, premium learning experiences, and modern digital solutions for businesses and developers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yoursfriend.com" />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YoursFriend Labs | Link Hub" />
    <meta
      name="twitter:description"
      content="Building innovative software products, premium learning experiences, and modern digital solutions."
    />

    <title>YoursFriend Labs | Link Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Inter variable font — full weight range with font-display:swap -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Fraunces variable font — multiple axes for lively typography -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..100&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind (CDN build — swap for a compiled Tailwind pipeline if you add PostCSS later) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter Variable", "Inter", "sans-serif"],
              serif: ["Fraunces Variable", "Fraunces", "serif"],
            },
            colors: {
              gold: {
                DEFAULT: "#B8874A",
                soft: "#D9A968",
                deep: "#8C6530",
                50: "#FBF4EA",
              },
              ink: "#111827",
              violet: {
                DEFAULT: "#7C3AED",
                deep: "#5B21B6",
                soft: "#8B5CF6",
                subtle: "#EDE9FE",
              },
              light: {
                DEFAULT: "#F9FAFB",
                card: "#FFFFFF",
                surface: "#F3F4F6",
                border: "#E5E7EB",
                muted: "#6B7280",
              },
            },
            animation: {
              float: "float 6s ease-in-out infinite",
              "float-slow": "float 8s ease-in-out infinite",
              "float-slower": "float 10s ease-in-out infinite",
              shimmer: "shimmer 3s ease-in-out infinite",
              "fade-in": "fadeIn 0.6s ease-out forwards",
              "fade-in-up": "fadeInUp 0.6s ease-out forwards",
              "fade-in-down": "fadeInDown 0.5s ease-out forwards",
              "slide-up": "slideUp 0.4s ease-out forwards",
              "glow-pulse": "glowPulse 3s ease-in-out infinite",
              "spin-slow": "spin 8s linear infinite",
              "pulse-soft": "pulseSoft 2s ease-in-out infinite",
              tilt: "tilt 0.3s ease-out",
              gradient: "gradient 8s ease infinite",
            },
            keyframes: {
              float: {
                "0%, 100%": { transform: "translateY(0px) scale(1)" },
                "50%": { transform: "translateY(-20px) scale(1.05)" },
              },
              shimmer: {
                "0%": { backgroundPosition: "-200% 0" },
                "100%": { backgroundPosition: "200% 0" },
              },
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              fadeInDown: {
                "0%": { opacity: "0", transform: "translateY(-10px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              slideUp: {
                "0%": { opacity: "0", transform: "translateY(10px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              glowPulse: {
                "0%, 100%": { opacity: "0.4" },
                "50%": { opacity: "0.8" },
              },
              pulseSoft: {
                "0%, 100%": { transform: "scale(1)" },
                "50%": { transform: "scale(1.03)" },
              },
              gradient: {
                "0%": { backgroundPosition: "0% 50%" },
                "50%": { backgroundPosition: "100% 50%" },
                "100%": { backgroundPosition: "0% 50%" },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-light text-ink antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
