<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="YoursFriend Labs — Courses, PasalManager, and our full ecosystem of products, all in one place."
    />
    <meta
      name="theme-color"
      content="#F9FAFB"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f1117"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="YoursFriend Labs | Link Hub" />
    <meta
      property="og:description"
      content="Building innovative software products, premium learning experiences, and modern digital solutions for businesses and developers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yoursfriend.com" />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YoursFriend Labs | Link Hub" />
    <meta
      name="twitter:description"
      content="Building innovative software products, premium learning experiences, and modern digital solutions."
    />

    <title>YoursFriend Labs | Link Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Inter variable font — full weight range with font-display:swap -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Fraunces variable font — multiple axes for lively typography -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..100&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind (CDN build — config loaded from /tailwind.config.js) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/tailwind.config.js"></script>
  </head>
  <body class="bg-light text-ink antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
